name: "PR Checks"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show PR info
        run: |
          echo "PR #${{ github.event.pull_request.number }}"
          echo "Title: ${{ github.event.pull_request.title }}"
          echo "Base branch: ${{ github.event.pull_request.base.ref }}"
          echo "Head branch: ${{ github.event.pull_request.head.ref }}"

      - name: List changed files
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          echo "Changed files:"
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Go tests
        run: |
          for GO_PACKAGE in "shippingservice" "productcatalogservice" "frontend/validator" "frontend/money"; do
            echo "Testing $GO_PACKAGE..."
            pushd src/$GO_PACKAGE
            go test ./... || exit 1
            popd
          done

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate products.json
        run: |
          python3 -m json.tool src/productcatalogservice/products.json > /dev/null
          echo "products.json is valid"

      - name: Validate currency_conversion.json
        run: |
          python3 -m json.tool src/currencyservice/data/currency_conversion.json > /dev/null
          echo "currency_conversion.json is valid"
